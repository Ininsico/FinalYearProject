server {
    listen 80;
    server_name fablet.artdevelopers.site www.fablet.artdevelopers.site;
    location /.well-known/acme-challenge { root /var/www/fablet; }
    root /var/www/fablet;
    index index.html;
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable" always; try_files $uri =404; }
    location / { add_header Cache-Control "no-cache" always; try_files $uri $uri/ /index.html; }
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
}

server {
    listen 443 ssl http2;
    server_name fablet.artdevelopers.site www.fablet.artdevelopers.site;
    ssl_certificate /etc/ssl/certs/fablet.crt;
    ssl_certificate_key /etc/ssl/private/fablet.key;
    root /var/www/fablet;
    index index.html;
    location = /favicon.ico { add_header Cache-Control "no-cache" always; return 302 /logo.png; }
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable" always; try_files $uri =404; }
    location / { add_header Cache-Control "no-cache" always; try_files $uri $uri/ /index.html; }
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
}
